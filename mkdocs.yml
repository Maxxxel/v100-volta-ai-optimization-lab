site_name: V100 Volta AI Optimization Lab
site_description: Reproducible local LLM research on one 16 GB Volta GPU
use_directory_urls: true
strict: true
theme:
  name: material
  font: false
  palette:
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Light mode
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Dark mode
  features:
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_css:
  - stylesheets/lab.css?v=3607ea475b0e383b
extra_javascript:
  - javascripts/screening.js?v=7af8f50daa3611bf
  - assets/benchmarks/benchmark-table-data.js
  - javascripts/benchmark-tables.js
  - assets/benchmarks/leaderboard-data.js?v=6302b73da144f317
  - javascripts/master-table.js?v=cd4ee1878fedad0a
  - javascripts/leaderboard.js?v=697620605486078d
extra:
  generator: false
nav:
  - Overview: index.md
  - Best-of V100: best-of-v100-2026.md
  - Candidate qualification: final-qualification.md
  - Jarvis Top 3: final-selection.md
  - Lean harness: lean-harness.md
  - Screening: screening.md
  - Benchmarks: configuration-comparison.md
  - Research archive:
      - Archive overview: archive.md
      - Optimization matrix: matrix.md
      - Experiment history: results.md
      - Qualified configurations: configurations.md
      - Negative results: rejected.md
      - Configuration history: configuration-archive.md
      - Model research: models.md
      - OmniCoder derivatives: omnicoder-derivatives.md
      - Weight integrity: weight-integrity-same-quantizer.md
      - Earlier weight review: weight-integrity.md
      - Compatibility: compatibility.md
      - Open questions: questions.md
      - Roadmap: roadmap.md
  - Methods:
      - Methodology: methodology.md
      - Pipeline decision: pipeline-methods.md
      - Pipeline performance: pipeline-performance.md
      - Hardware: hardware.md
      - Benchmark definitions: benchmark-register.md
      - Safety and admission: broker-admission.md
      - Scientific background: background.md
      - Papers and sources: sources.md
      - Reproduction: reproduce.md
      - Public export policy: publication.md
  - Deutsch: de.md
validation:
  nav:
    omitted_files: ignore
